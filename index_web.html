<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHARLIKA REPUBLIC | Premium E-Commerce</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap');
        :root { --color-bg: #ffffff; --color-text: #000000; --color-gray: #86868b; --ease-apple: cubic-bezier(0.4, 0, 0.2, 1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--color-bg); color: var(--color-text); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        .navbar { position: fixed; top: 0; width: 100%; padding: 16px 40px; z-index: 1000; transition: all 0.4s var(--ease-apple); }
        .nav-container { max-width: 1300px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 700; }
        .nav-links a { margin: 0 16px; font-size: 14px; text-decoration: none; color: inherit; font-weight: 500; }
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; overflow: hidden; color: white; background: black; }
        .hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; z-index: -1; opacity: 0.8; }
        .hero-title { font-family: 'Poppins', sans-serif; font-size: clamp(48px, 8vw, 96px); font-weight: 700; line-height: 1; margin-bottom: 16px; }
        .btn-hero { padding: 16px 32px; border-radius: 999px; border: none; background: white; color: black; font-weight: 600; cursor: pointer; transition: transform 0.3s; }
        .btn-hero:hover { transform: scale(1.05); }
        .section { padding: 80px 40px; max-width: 1300px; margin: 0 auto; }
        .collections-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
        .card { height: 400px; border-radius: 16px; position: relative; overflow: hidden; cursor: pointer; background: #eee; transition: transform 0.4s; }
        .card:hover { transform: scale(1.02); }
        .card-overlay { position: absolute; bottom: 24px; left: 24px; color: white; font-size: 24px; font-weight: 700; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 32px; }
        .product { cursor: pointer; transition: transform 0.4s; }
        .product-img-box { height: 380px; background: #f5f5f7; border-radius: 16px; overflow: hidden; margin-bottom: 16px; }
        .product-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 3000; display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; width: 400px; padding: 40px; border-radius: 24px; position: relative; text-align: center; }
        .cart-sidebar { position: fixed; right: -400px; top: 0; width: 400px; height: 100%; background: white; z-index: 4000; padding: 40px; transition: right 0.5s var(--ease-apple); display: flex; flex-direction: column; }
        .cart-sidebar.active { right: 0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>
    <header class="navbar" id="navbar">
        <div class="nav-container">
            <div class="logo">MAHARLIKA REPUBLIC</div>
            <nav class="nav-links"><a href="#home">Home</a><a href="#shop">Shop</a><a href="#collections">Collections</a></nav>
            <div id="cartBtn" style="cursor:pointer; position:relative;">🛒 <span id="cartCount">0</span></div>
        </div>
    </header>

    <section class="hero" id="home">
        <div class="hero-bg" style="background-image: url('https://images.unsplash.com/photo-1552374196-1ab2a1c593e8?q=80&w=1200&auto=format&fit=crop');"></div>
        <div class="hero-content">
            <h1 class="hero-title">OWN YOUR STYLE</h1>
            <p style="margin-bottom:48px; font-size:20px;">Modern streetwear for the bold generation</p>
            <button class="btn-hero">Shop Now</button>
        </div>
    </section>

    <section class="section" id="collections">
        <h2 style="margin-bottom:40px; font-family:Poppins;">Collections</h2>
        <div class="collections-grid">
            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1523381210434-271e8be1f52b?q=80&w=800&auto=format&fit=crop'); background-size:cover;"><div class="card-overlay">Urban Core</div></div>
            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?q=80&w=800&auto=format&fit=crop'); background-size:cover;"><div class="card-overlay">Minimal Drop</div></div>
        </div>
    </section>

    <section class="section" id="shop">
        <h2 style="margin-bottom:40px; font-family:Poppins;">New Drops</h2>
        <div class="products-grid">
            <div class="product" data-name="Maharlika Bomber" data-price="290" data-img="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?q=80&w=800&auto=format&fit=crop">
                <div class="product-img-box"><img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?q=80&w=800&auto=format&fit=crop"></div>
                <h3>Maharlika Bomber</h3><p>$290.00</p>
            </div>
            <div class="product" data-name="Signature Sneakers" data-price="350" data-img="https://images.unsplash.com/photo-1560769629-975ec94e6a86?q=80&w=800&auto=format&fit=crop">
                <div class="product-img-box"><img src="https://images.unsplash.com/photo-1560769629-975ec94e6a86?q=80&w=800&auto=format&fit=crop"></div>
                <h3>Signature Sneakers</h3><p>$350.00</p>
            </div>
        </div>
    </section>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <span id="modalClose" style="position:absolute; right:20px; top:20px; cursor:pointer;">✕</span>
            <div id="modalImg" style="height:250px; background-size:cover; border-radius:12px; margin-bottom:20px;"></div>
            <h2 id="modalName"></h2><p id="modalPrice" style="margin:10px 0 20px; color:#86868b;"></p>
            <button id="addToCart" class="btn-hero" style="width:100%; background:black; color:white;">Add to Bag</button>
        </div>
    </div>

    <div class="cart-sidebar" id="cartSidebar">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;"><h2>Your Bag</h2><span id="cartClose" style="cursor:pointer;">✕</span></div>
        <div id="cartItems"><p style="text-align:center; color:#86868b; margin-top:40px;">Bag is empty.</p></div>
    </div>

    <script>
        gsap.registerPlugin(ScrollTrigger);
        document.addEventListener('DOMContentLoaded', () => {
            const products = document.querySelectorAll(".product");
            const modal = document.getElementById("modalOverlay");
            const cartSidebar = document.getElementById("cartSidebar");
            let cart = [];

            products.forEach(p => p.addEventListener("click", () => {
                document.getElementById("modalName").textContent = p.dataset.name;
                document.getElementById("modalPrice").textContent = "$" + p.dataset.price;
                document.getElementById("modalImg").style.backgroundImage = `url('${p.dataset.img}')`;
                modal.classList.add("active");
                document.getElementById("addToCart").onclick = () => {
                    cart.push(p.dataset.name);
                    document.getElementById("cartCount").textContent = cart.length;
                    modal.classList.remove("active");
                    cartSidebar.classList.add("active");
                    document.getElementById("cartItems").innerHTML = cart.map(i => `<div style="margin-bottom:10px;">${i}</div>`).join('');
                };
            }));

            document.getElementById("modalClose").onclick = () => modal.classList.remove("active");
            document.getElementById("cartBtn").onclick = () => cartSidebar.classList.add("active");
            document.getElementById("cartClose").onclick = () => cartSidebar.classList.remove("active");

            gsap.to(".navbar", { background: "rgba(255,255,255,0.9)", backdropFilter: "blur(20px)", scrollTrigger: { trigger: "body", start: "top -50", toggleActions: "play none none reverse" } });
            gsap.from(".hero-title", { y: 100, opacity: 0, duration: 1 });
            gsap.from(".card", { scrollTrigger: { trigger: ".collections-grid", start: "top 85%" }, y: 60, opacity: 0, stagger: 0.2 });
            gsap.from(".product", { scrollTrigger: { trigger: ".products-grid", start: "top 85%" }, y: 80, opacity: 0, stagger: 0.15 });
        });
    </script>
</body>
</html>
